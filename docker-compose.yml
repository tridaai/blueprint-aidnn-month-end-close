# Production-shaped stack for the close blueprint.
#
#   docker compose up --build
#
# opens the console at http://localhost:8000. Source batches,
# close runs, board packs, and graph checkpoints live in
# PostgreSQL (db); raw extract bytes in object storage (minio).
# The api service is stateless; scale it by adding replicas
# against the same db/minio.
#
# The stack runs the labelled offline engine by default so the
# close can be exercised end to end. A customer deployment sets
# FINANCE_ENGINE=aidnn and AIDNN_WORKSPACE_URL to the workspace
# endpoint agreed with Isotopes during onboarding — there is no
# public aidnn API to point at by default, and the service
# refuses to start in aidnn mode without the URL rather than
# quietly substituting the offline engine.
#
# Credentials below are local-stack defaults for this reference
# stack, overridable via the environment. A real deployment
# injects them from a secrets manager and puts TLS in front of
# every hop — see "What a production deploy still needs" in
# docs/architecture.md.

services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      FINANCE_ENGINE: ${FINANCE_ENGINE:-offline}
      AIDNN_WORKSPACE_URL: ${AIDNN_WORKSPACE_URL:-}
      AIDNN_API_TOKEN: ${AIDNN_API_TOKEN:-}
      DATABASE_URL: <redacted>
      S3_ENDPOINT_URL: http://minio:8333
      S3_BUCKET: close-extracts
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aidnnclose
      POSTGRES_PASSWORD: <redacted>
      POSTGRES_DB: aidnnclose
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidnnclose -d aidnnclose"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object storage for raw extract bytes. MinIO
  # Inc. locked public pulls of minio/minio behind a login in
  # 2025, so this runs SeaweedFS's S3 gateway instead — same
  # path-style PUT/GET/HEAD API this app's S3 client needs.
  # Service name stays `minio` so S3_ENDPOINT_URL above doesn't
  # need to change; only the port (9000 -> 8333) does.
  minio:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip=0.0.0.0
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    # One-shot: create the extracts bucket, then exit. SeaweedFS's
    # S3 gateway doesn't enforce SigV4 auth in this unconfigured
    # mode, so a plain unsigned PUT is enough (no mc / MinIO CLI
    # needed).
    image: curlimages/curl:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c", "code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://minio:8333/close-extracts); case $$code in 200|204|409) exit 0 ;; *) echo \"bucket create failed: HTTP $$code\" >&2; exit 1 ;; esac"]

volumes:
  pgdata:
  miniodata:
